name: Linux release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          unset NODE_ENV npm_config_production npm_config_omit ELECTRON_SKIP_BINARY_DOWNLOAD
          npm ci --include=dev
          npm ls electron electron-builder esbuild
          node -e "const fs=require('node:fs'); const binary=require('electron'); if (!fs.existsSync(binary)) throw new Error('Electron binary missing: ' + binary); console.log('Electron binary:', binary)"

      - name: Check syntax
        run: npm run check

      - name: Run unit and contract tests
        run: npm test

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Electron UI smoke test
        run: npm run bundle && xvfb-run -a ./node_modules/.bin/electron --no-sandbox . --ui-smoke-test

      - name: Build AppImage and DEB
        run: npm run dist:linux

      - name: Generate SPDX SBOM
        run: npm sbom --sbom-format spdx > "dist/chatdesk-linux-${GITHUB_REF_NAME}.spdx.json"

      - name: Generate SHA-256 checksums
        run: cd dist && sha256sum *.AppImage *.deb *.spdx.json > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb

      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
          sbom-path: dist/chatdesk-linux-${{ github.ref_name }}.spdx.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.spdx.json
            dist/SHA256SUMS
          generate_release_notes: true
