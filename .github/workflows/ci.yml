name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check syntax
        run: npm run check

      - name: Run unit and contract tests
        run: npm test

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Configure Electron sandbox helper
        run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Run Electron UI smoke test
        run: npm run test:ui
