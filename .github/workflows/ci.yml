name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          unset NODE_ENV npm_config_production npm_config_omit ELECTRON_SKIP_BINARY_DOWNLOAD
          npm ci --include=dev
          npm ls electron electron-builder esbuild
          node -e "const fs=require('node:fs'); const binary=require('electron'); if (!fs.existsSync(binary)) throw new Error('Electron binary missing: ' + binary); console.log('Electron binary:', binary)"

      - name: Check syntax
        run: npm run check

      - name: Run unit and contract tests
        run: npm test

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Electron UI smoke test
        run: npm run bundle && xvfb-run -a ./node_modules/.bin/electron --no-sandbox . --ui-smoke-test
